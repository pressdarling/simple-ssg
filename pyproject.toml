[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ssg"
version = "0.1.0"
authors = [
    {name = "Brady Clarke", email = "hello@bradyclarke.com"},
]
description = "A minimalist static site generator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["static-site-generator", "markdown", "html", "website", "blog", "ssg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Operating System :: OS Independent",
]
dependencies = [
    "markdown>=3.3.0",
    "pyyaml>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/bradyclarke/simple-ssg"
"Documentation" = "https://github.com/bradyclarke/simple-ssg/blob/main/README.md"
"Repository" = "https://github.com/bradyclarke/simple-ssg.git"
"Bug Tracker" = "https://github.com/bradyclarke/simple-ssg/issues"
"Changelog" = "https://github.com/bradyclarke/simple-ssg/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "twine>=4.0",
    "build>=0.10",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
simple-ssg = "simple_ssg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_ssg*"]
exclude = ["logs*", ".claude*"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "B", "I", "W", "C4", "UP", "N", "ANN", "DTZ", "COM"]
ignore = ["ANN101", "ANN401"]

[tool.ruff.isort]
known-first-party = ["simple_ssg"]

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ANN", "E501"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
